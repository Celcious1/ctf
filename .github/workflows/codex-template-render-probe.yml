name: Codex harmless template render probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-template-render-probe.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-clean-up-probe-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Open temporary harmless pull request
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="codex-template-render-probe-${GITHUB_RUN_ID}"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          printf '%s\n' 'Harmless temporary PR for Mergify template rendering validation.' > CODEX_TEMPLATE_RENDER_PROBE.txt
          git add CODEX_TEMPLATE_RENDER_PROBE.txt
          git commit -m 'test: open harmless Mergify template probe PR'
          git push origin "$branch"
          set +e
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Codex harmless Mergify template render probe" \
            --body "Temporary tester-owned PR for arithmetic-only template rendering validation. It will be closed automatically.")
          create_status=$?
          set -e
          if [ "$create_status" -ne 0 ]; then
            git push origin --delete "$branch" || true
            exit "$create_status"
          fi
          pr_number=${pr_url##*/}
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"
          printf 'Opened temporary PR #%s\n' "$pr_number"

      - name: Leave PR open briefly for observation
        if: steps.create.outputs.pr_number != ''
        shell: bash
        run: sleep 180

      - name: Close PR and delete branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
          PROBE_BRANCH: ${{ steps.create.outputs.branch }}
        shell: bash
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr close "$PR_NUMBER" --delete-branch
          elif [ -n "$PROBE_BRANCH" ]; then
            git push origin --delete "$PROBE_BRANCH" || true
          fi
